name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build TWA Project Manually
        run: |
          bubblewrap init --manifest=https://ashokgolla108-netizen.github.io/Tomoto-rates-/manifest.json --directory=android-app --skip-validation || true
          cd android-app || mkdir -p android-app && cd android-app

      - name: Build APK via Gradle
        run: |
          cd android-app
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            echo "Gradle wrapper missing, skipping build step for now."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yumika-luck-apk
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
